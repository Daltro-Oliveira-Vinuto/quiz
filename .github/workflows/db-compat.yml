name: Compatibilidade de banco

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  DEBUG: "True"
  SECRET_KEY: ci-secret-key
  DB_NAME: quiz_db
  DB_HOST: 127.0.0.1

jobs:
  mysql-mariadb:
    name: testes em ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ["mysql:8.0", "mysql:8.4", "mariadb:10.11", "mariadb:11.4"]

    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quiz_db
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: quiz_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot || mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_ENGINE: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_PORT: "3306"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do cliente MySQL
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
      - name: Dependências
        run: |
          pip install poetry
          poetry install --no-root --no-interaction
      - name: Migrações pendentes?
        run: poetry run python manage.py makemigrations --check --dry-run
      - name: Migrações
        run: poetry run python manage.py migrate --noinput
      - name: Testes
        run: poetry run python manage.py test --noinput -v 2

  postgres:
    name: testes em postgres:16
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quiz_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_ENGINE: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do cliente MySQL (o mysqlclient está no pyproject)
        run: sudo apt-get update && sudo apt-get install -y pkg-config default-libmysqlclient-dev build-essential
      - name: Dependências
        run: |
          pip install poetry
          poetry install --no-root --no-interaction
      - name: Migrações
        run: poetry run python manage.py migrate --noinput
      - name: Testes
        run: poetry run python manage.py test --noinput -v 2
